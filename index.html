<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title data-i18n="meta_title">CRONCORE — The Partners' Circle</title>
<meta name="description" data-i18n-meta="meta_desc" content="A private circle of partners. By invitation." />
<meta property="og:type" content="website" />
<meta property="og:title" content="CRONCORE — The Partners' Circle" />
<meta property="og:description" content="A private circle of partners. By invitation." />
<meta property="og:image" content="assets/logo-croncore.png" />
<meta name="theme-color" content="#0a1810" />

<!-- Replace with the deployed Cloudflare Worker URL when ready. While empty,
     the form falls back to mailto: with the same content. -->
<meta name="apply-endpoint" content="" />
<meta name="apply-mailto" content="hello@croncore.com" />

<link rel="icon" type="image/png" href="assets/logo-croncore.png" />
<link rel="apple-touch-icon" href="assets/logo-croncore.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500;1,6..72,600&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --f-950: oklch(0.12 0.025 150);
  --f-900: oklch(0.16 0.035 150);
  --f-800: oklch(0.28 0.06 150);
  --f-600: oklch(0.46 0.07 150);
  --f-500: oklch(0.56 0.08 150);
  --f-400: oklch(0.68 0.07 150);
  --f-300: oklch(0.80 0.05 150);

  --cream-50:  oklch(0.97 0.015 85);
  --cream-200: oklch(0.86 0.022 85);
  --cream-300: oklch(0.72 0.022 85);
  --cream-400: oklch(0.55 0.018 85);

  --clay-500: oklch(0.72 0.16 45);
  --gold-500: oklch(0.78 0.12 90);

  --ink:   var(--cream-50);
  --ink-2: var(--cream-200);
  --ink-3: var(--cream-300);
  --ink-4: var(--cream-400);

  --font-sans:  "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "Newsreader", ui-serif, Georgia, serif;
  --font-mono:  "JetBrains Mono", ui-monospace, monospace;

  --s-3:12px; --s-4:16px; --s-5:24px;
  --r-md:16px; --r-xl:32px; --r-pill:999px;

  --glass-line: rgba(255,255,255,0.10);
  --glass-line-2: rgba(255,255,255,0.18);
  --rim-dark:
    inset 0 1px 0 rgba(255,255,255,0.10),
    inset 0 -1px 0 rgba(0,0,0,0.30);
  --rim-dark-2:
    inset 0 1px 0 rgba(255,255,255,0.20),
    inset 0 -1px 0 rgba(0,0,0,0.40);
  --float-1: 0 1px 2px rgba(0,0,0,0.30), 0 6px 14px -4px rgba(0,0,0,0.35);
  --float-2: 0 2px 4px rgba(0,0,0,0.35), 0 22px 44px -14px rgba(0,0,0,0.50);
  --float-3: 0 40px 80px -24px rgba(0,0,0,0.65);

  --ease-out: cubic-bezier(.22,.9,.24,1);
  --mxp: 50vw; --myp: 50vh;
}

*,*::before,*::after{ box-sizing: border-box; }
html, body{
  margin:0; padding:0;
  height:100%; height:100svh;
  overflow:hidden;
  overscroll-behavior: none;
}
body{
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--f-950);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.55;
}
::selection{ background: oklch(0.56 0.08 150 / .45); color: var(--cream-50); }

html[lang="ar"] body{ font-family: "Noto Sans Arabic", var(--font-sans); }
html[lang="he"] body{ font-family: "Noto Sans Hebrew", var(--font-sans); }
html[lang="ar"] em{ font-family: "Noto Sans Arabic", var(--font-serif); font-style: normal; }
html[lang="he"] em{ font-family: "Noto Serif Hebrew", var(--font-serif); font-style: normal; }
html[lang="ar"] .mono, html[lang="he"] .mono{ letter-spacing:.02em; text-transform:none; }

/* =========================================================
   ATMOSPHERE
   ========================================================= */
.atmosphere{
  position: fixed; inset: -10%;
  z-index: 0; pointer-events: none;
  background:
    radial-gradient(55% 50% at 18% 12%, oklch(0.30 0.07 150 / .60), transparent 70%),
    radial-gradient(45% 45% at 88% 22%, oklch(0.38 0.06 145 / .35), transparent 65%),
    radial-gradient(60% 55% at 80% 80%, oklch(0.50 0.13 45 / .18), transparent 70%),
    radial-gradient(70% 60% at 30% 80%, oklch(0.22 0.06 150 / .55), transparent 70%),
    linear-gradient(180deg, oklch(0.13 0.025 150), oklch(0.10 0.020 150));
  filter: blur(40px) saturate(115%);
}
.atmosphere::after{
  content:""; position:absolute; inset:0;
  background-image:
    radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.22) 1px, transparent 1px);
  background-size: 3px 3px, 8px 8px;
  background-position: 0 0, 2px 3px;
  mix-blend-mode: overlay; opacity: .85;
}
.atmosphere::before{
  content:""; position:absolute; inset:0;
  background: radial-gradient(110% 80% at 50% 50%, transparent 50%, oklch(0.07 0.02 150 / .75) 100%);
}
.aurora, .aurora-2{
  position: fixed; inset: -25%;
  z-index: 0; pointer-events: none;
  mix-blend-mode: screen;
  filter: blur(70px) saturate(140%);
  will-change: transform;
}
.aurora{
  background:
    radial-gradient(46% 38% at 30% 35%, oklch(0.58 0.18 150 / .50), transparent 60%),
    radial-gradient(38% 30% at 72% 60%, oklch(0.66 0.14 130 / .38), transparent 70%);
  opacity: .85;
  animation: aurora-drift 26s ease-in-out infinite alternate;
}
.aurora-2{
  background:
    radial-gradient(40% 32% at 80% 22%, oklch(0.78 0.12 90 / .40), transparent 65%),
    radial-gradient(32% 26% at 18% 82%, oklch(0.66 0.20 25 / .32), transparent 70%);
  opacity: .75;
  animation: aurora-drift-2 36s ease-in-out infinite alternate-reverse;
  animation-delay: -12s;
}
@keyframes aurora-drift{
  0%   { transform: translate3d(-3%, -2%, 0) scale(1);    }
  35%  { transform: translate3d( 6%, -6%, 0) scale(1.12); }
  70%  { transform: translate3d( 2%,  7%, 0) scale(.94);  }
  100% { transform: translate3d(-5%,  4%, 0) scale(1.06); }
}
@keyframes aurora-drift-2{
  0%   { transform: translate3d( 4%,  3%, 0) scale(1.05); }
  40%  { transform: translate3d(-6%,  5%, 0) scale(.92);  }
  75%  { transform: translate3d( 3%, -4%, 0) scale(1.18); }
  100% { transform: translate3d( 7%,  1%, 0) scale(.98);  }
}

/* Shared 3D canvas — preloader chaos, the assembled circle, the dive */
#gl{
  position: fixed; inset: 0; z-index: 1;
  width: 100%; height: 100%;
  display: block;
  pointer-events: none;
}

/* =========================================================
   PRELOADER LAYER — just numbers over the living scene
   ========================================================= */
.pre{
  position: fixed; inset: 0; z-index: 40;
  pointer-events: none;
}
.pre-count{
  position: absolute; bottom: 14px; right: clamp(18px, 4vw, 48px);
  font-weight: 200;
  font-size: clamp(64px, 12vw, 150px);
  line-height: 1; letter-spacing: -.04em;
  color: var(--cream-50);
  font-variant-numeric: tabular-nums;
  opacity: 0;
}
html[dir="rtl"] .pre-count{ right: auto; left: clamp(18px, 4vw, 48px); }
.pre-count .pct{ font-size: .2em; font-weight: 400; color: var(--cream-300); vertical-align: super; }
.pre.done{ display: none; }

/* =========================================================
   NAV — brand + languages, nothing else
   ========================================================= */
.nav{
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center;
  padding: 18px clamp(16px, 4vw, 48px);
}
.brand-lock{ display:flex; align-items:center; gap: 10px; text-decoration:none; color:inherit; }
.brand-lock img{ width: 26px; height: 26px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.55)); }
.brand-lock .wm{ font-weight: 600; letter-spacing: .14em; font-size: 14px; color: var(--cream-50); }
.lang{
  margin-left: auto;
  display:flex; gap: 2px; padding: 3px;
  border-radius: var(--r-pill);
  background: rgba(0,0,0,0.30);
  border: 1px solid var(--glass-line);
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em;
  align-items:center;
}
html[dir="rtl"] .lang{ margin-left: 0; margin-right: auto; }
.lang button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  color: var(--ink-3); padding: 6px 9px; border-radius: var(--r-pill);
  font: inherit; transition: background .15s, color .15s;
}
.lang button:hover{ color: var(--ink); }
.lang button.active{
  color: var(--cream-50);
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: var(--rim-dark);
}
@media (max-width: 420px){
  .lang{ font-size: 9.5px; }
  .lang button{ padding: 5px 6px; }
  .brand-lock .wm{ font-size: 12.5px; letter-spacing: .08em; }
}

/* =========================================================
   STAGE — one screen, one message
   ========================================================= */
.stage{
  position: relative; z-index: 10;
  height: 100svh;
  display: grid; place-items: center;
  pointer-events: none;
}

/* The emerald IS the call to action: an invisible circular hotspot over
   the core, with a quiet caption beneath it. */
.gem-cta{
  appearance: none; border: 0; background: transparent;
  pointer-events: auto; cursor: pointer;
  position: relative;
  width: clamp(190px, 34vmin, 320px);
  aspect-ratio: 1 / 1;
  border-radius: 999px;
  display: grid; place-items: center;
  isolation: isolate;
  -webkit-tap-highlight-color: transparent;
}
.gem-cta:focus-visible{ outline: 1px solid oklch(0.68 0.07 150 / .7); outline-offset: 12px; }
.gem-ring{
  position: absolute; inset: 6%;
  border-radius: 999px;
  border: 1px solid oklch(0.80 0.05 150 / 0);
  transition: border-color .5s ease, transform .6s var(--ease-out);
  transform: scale(.92);
}
.gem-cta:hover .gem-ring{
  border-color: oklch(0.80 0.05 150 / .35);
  transform: scale(1);
}
.gem-label{
  position: absolute;
  top: calc(100% + clamp(2px, 1.4vh, 14px));
  left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: clamp(11px, 1.2vw, 13px);
  letter-spacing: .32em; text-transform: uppercase;
  color: var(--cream-200);
  white-space: nowrap;
  text-shadow: 0 2px 20px rgba(0,0,0,.8);
  transition: color .3s ease, letter-spacing .45s var(--ease-out), text-shadow .3s ease;
  padding-inline-start: .32em; /* optically centre the tracked text */
}
.gem-cta:hover .gem-label{
  color: var(--cream-50);
  letter-spacing: .42em;
  text-shadow: 0 0 24px oklch(0.68 0.07 150 / .8), 0 2px 20px rgba(0,0,0,.8);
}
html[lang="ar"] .gem-label, html[lang="he"] .gem-label{
  letter-spacing: .06em; text-transform: none; padding-inline-start: 0;
  font-size: clamp(13px, 1.4vw, 15px);
}
html[lang="ar"] .gem-cta:hover .gem-label,
html[lang="he"] .gem-cta:hover .gem-label{ letter-spacing: .1em; }

/* Magnetic primary button with cursor-origin fill */
.btn{
  --bx: 50%; --by: 50%;
  position: relative; isolation: isolate;
  display:inline-flex; align-items:center; justify-content:center; gap: 12px;
  font-family: var(--font-sans); font-weight: 500;
  border-radius: var(--r-pill);
  padding: 18px 34px; font-size: 16px;
  letter-spacing: -.005em; line-height: 1;
  text-decoration:none; cursor:pointer; border: 1px solid transparent;
  color: var(--cream-50);
  overflow: hidden;
  transition: transform .3s var(--ease-out), box-shadow .3s ease;
  will-change: transform;
  background: linear-gradient(180deg, var(--f-600), var(--f-800));
  border-color: rgba(0,0,0,0.4);
  box-shadow: var(--float-2),
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.45),
    0 0 0 1px rgba(255,255,255,0.06);
}
.btn > *{ position: relative; z-index: 2; }
.btn::before{
  content:""; position:absolute; inset:1px; border-radius:inherit; z-index:1;
  background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent 50%);
  pointer-events:none;
}
.btn::after{
  content:""; position:absolute; z-index:0;
  left: var(--bx); top: var(--by);
  width: 0; height: 0; border-radius: 999px;
  transform: translate(-50%,-50%);
  background: radial-gradient(circle, oklch(0.72 0.10 150 / .95), oklch(0.60 0.09 150 / .9) 60%);
  transition: width .5s var(--ease-out), height .5s var(--ease-out), opacity .4s ease;
  opacity: 0;
}
.btn:hover::after{ width: 240%; height: 640%; opacity: 1; }
.btn:hover{ box-shadow: 0 16px 40px -12px oklch(0.55 0.14 150 / .6), inset 0 1px 0 rgba(255,255,255,0.25); }
.btn:active{ transform: scale(.985); }
.btn:disabled{ opacity:.6; cursor:progress; pointer-events:none; }
.btn .arr{ display:inline-grid; place-items:center; width: 18px; height: 18px; }
.btn .arr svg{ width: 15px; height: 15px; transition: transform .3s var(--ease-out); }
.btn:hover .arr svg{ transform: translateX(3px); }
html[dir="rtl"] .btn .arr svg{ transform: scaleX(-1); }
html[dir="rtl"] .btn:hover .arr svg{ transform: scaleX(-1) translateX(3px); }
.btn-ghost{
  background: rgba(255,255,255,0.05);
  border-color: var(--glass-line-2);
  box-shadow: var(--float-1), var(--rim-dark);
}
.btn-ghost::after{ background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,.10) 60%); }

/* =========================================================
   WORLD HINT + DIVE OVERLAY (scroll → the world)
   ========================================================= */
.world-hint{
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 20;
  display:flex; flex-direction:column; align-items:center; gap: 10px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .3em; text-transform: uppercase;
  color: var(--ink-4);
  pointer-events: auto; cursor: pointer;
  opacity: 0;
  white-space: nowrap;
}
.world-hint[hidden]{ display: none; }
.world-hint i{
  display:block; width:1px; height: 40px;
  background: linear-gradient(180deg, transparent, var(--cream-300));
  overflow:hidden; position:relative;
}
.world-hint i::after{
  content:""; position:absolute; left:0; top:-100%;
  width:100%; height:100%;
  background: linear-gradient(180deg, transparent, var(--cream-50));
  animation: hintdrop 2.2s cubic-bezier(.87,0,.13,1) infinite;
}
@keyframes hintdrop{ 0%{ top:-100%; } 55%,100%{ top:100%; } }

.dive{
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(60% 50% at 50% 50%, oklch(0.10 0.02 150 / .0), oklch(0.07 0.02 150 / .55) 100%);
}
.dive-box{ display:flex; flex-direction:column; align-items:center; gap: 16px; }
.dive-text{
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .4em; text-transform: uppercase;
  color: var(--cream-200);
  white-space: nowrap;
}
.dive-bar{
  width: min(300px, 60vw); height: 1px;
  background: rgba(255,255,255,.12);
  overflow: hidden;
}
.dive-bar i{
  display:block; height:100%; width:100%;
  background: linear-gradient(90deg, var(--f-400), var(--gold-500));
  transform-origin: left; transform: scaleX(0);
}
html[dir="rtl"] .dive-bar i{ transform-origin: right; }
.dive-flash{
  position: fixed; inset: 0; z-index: 60;
  background: radial-gradient(60% 60% at 50% 50%, oklch(0.95 0.06 150), oklch(0.75 0.10 150));
  opacity: 0; pointer-events: none;
}

/* =========================================================
   MICRO FOOTER
   ========================================================= */
.micro-footer{
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
  display:flex; justify-content:space-between; align-items:center;
  gap: var(--s-3); flex-wrap: wrap;
  padding: 12px clamp(16px, 4vw, 48px) 14px;
  font-family: var(--font-mono);
  font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: oklch(0.55 0.018 85 / .75);
  pointer-events: none;
}
@media (max-width: 640px){
  .micro-footer{ justify-content: center; text-align:center; }
  .micro-footer span:nth-child(2){ display: none; }
}

/* =========================================================
   CURSOR + SPOTLIGHT
   ========================================================= */
.spotlight{
  position: fixed; left:0; top:0;
  width: 640px; height: 640px;
  pointer-events:none; z-index: 2;
  transform: translate3d(var(--mxp), var(--myp), 0) translate(-50%,-50%);
  background: radial-gradient(50% 50% at 50% 50%,
    oklch(0.80 0.14 150 / .15),
    oklch(0.78 0.12 90 / .06) 45%,
    transparent 72%);
  mix-blend-mode: screen;
  filter: blur(12px);
  will-change: transform;
  opacity: 0;
  transition: opacity .6s ease;
}
html.has-cursor .spotlight{ opacity: 1; }
body:not(.is-ready) .spotlight{ opacity: 0 !important; }
@media (hover: none), (pointer: coarse){ .spotlight{ display:none; } }
@media (prefers-reduced-motion: reduce){ .spotlight{ display:none; } }

@media (hover: hover) and (pointer: fine){
  html.cursor-on, html.cursor-on body{ cursor: none; }
  html.cursor-on a, html.cursor-on button,
  html.cursor-on input, html.cursor-on select,
  html.cursor-on textarea, html.cursor-on label{ cursor: none; }
  html.cursor-on body:not(.is-ready),
  html.cursor-on body:not(.is-ready) *{ cursor: auto; }

  .cursor-dot, .cursor-ring{
    position: fixed; left:0; top:0;
    pointer-events:none; z-index: 9999;
    transform: translate3d(var(--mxp), var(--myp), 0) translate(-50%,-50%);
    will-change: transform;
  }
  .cursor-dot{
    width: 5px; height: 5px; border-radius: 999px;
    background: var(--cream-50);
    box-shadow: 0 0 8px oklch(0.95 0.05 150 / .6);
    transition: opacity .3s ease;
  }
  .cursor-ring{
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.40);
    transition: width .25s ease, height .25s ease,
                border-color .25s ease, background .25s ease, opacity .25s ease;
  }
  html.cursor-hover .cursor-ring{
    width: 56px; height: 56px;
    border-color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.05);
  }
  html.cursor-press .cursor-ring{ width: 28px; height: 28px; background: rgba(255,255,255,0.12); }
  html.modal-open .cursor-dot, html.modal-open .cursor-ring{ opacity: 0; }
  body:not(.is-ready) .cursor-dot, body:not(.is-ready) .cursor-ring{ opacity: 0; }
}
@media (hover: none), (pointer: coarse){ .cursor-dot, .cursor-ring{ display:none; } }

/* Initial hidden states (JS present only) */
html.js .nav, html.js .gem-label,
html.js .world-hint, html.js .micro-footer span{ opacity: 0; }

@media (prefers-reduced-motion: reduce){
  .aurora, .aurora-2, .world-hint i::after{ animation: none !important; }
  html.js .nav, html.js .gem-label,
  html.js .world-hint, html.js .micro-footer span{ opacity: 1 !important; transform: none !important; }
  .pre{ display: none; }
}
</style>
</head>
<body>

<div class="atmosphere"></div>
<div class="aurora" aria-hidden="true"></div>
<div class="aurora-2" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="spotlight" aria-hidden="true"></div>

<!-- PRELOADER LAYER — the circle assembles itself on the shared canvas -->
<div class="pre" id="pre" aria-hidden="true">
  <div class="pre-count"><span id="preNum">0</span><span class="pct">%</span></div>
</div>

<!-- NAV -->
<header class="nav" id="nav">
  <a class="brand-lock" href="#">
    <img src="assets/logo-croncore.png" alt="" />
    <span class="wm">CRONCORE</span>
  </a>
  <div class="lang" role="group" aria-label="Language">
    <button class="active" data-lang="en">EN</button>
    <button data-lang="de">DE</button>
    <button data-lang="ru">RU</button>
    <button data-lang="ar">AR</button>
    <button data-lang="he">HE</button>
    <button data-lang="es">ES</button>
  </div>
</header>

<!-- STAGE — the emerald itself is the button; it leads to the bot -->
<main class="stage">
  <a class="gem-cta" id="open-apply" href="https://t.me/CRONCORE_bot" target="_blank" rel="noopener" aria-label="Request access">
    <span class="gem-ring" aria-hidden="true"></span>
    <span class="gem-label" data-i18n="btn_apply">Request access</span>
  </a>
</main>

<!-- SCROLL → THE WORLD (silent line, no words) -->
<div class="world-hint" id="world-hint" hidden>
  <i></i>
</div>
<div class="dive" id="dive" aria-hidden="true">
  <div class="dive-box">
    <div class="dive-text" data-i18n="world_entering">Entering the world</div>
    <div class="dive-bar"><i id="dive-fill"></i></div>
  </div>
</div>

const RTL_LANGS = new Set(["ar", "he"]);
const SUPPORTED = Object.keys(I18N);

function applyLang(lang){
  if (!I18N[lang]) lang = "en";
  const d = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.has(lang) ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (d[k] !== undefined) el.textContent = d[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const k = el.getAttribute("data-i18n-html");
    if (d[k] !== undefined) el.innerHTML = d[k];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const k = el.getAttribute("data-i18n-placeholder");
    if (d[k] !== undefined) el.setAttribute("placeholder", d[k]);
  });

  if (d.meta_title) document.title = d.meta_title;
  const md = document.querySelector('meta[data-i18n-meta="meta_desc"]');
  if (md && d.meta_desc) md.setAttribute("content", d.meta_desc);

  document.querySelectorAll(".lang button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  try { localStorage.setItem("croncore_lang", lang); } catch(e){}
}

/* English by default — the browser locale no longer decides. Only an
   explicit choice (persisted in localStorage) switches the language. */
function detectInitialLang(){
  try {
    const saved = localStorage.getItem("croncore_lang");
    if (saved && I18N[saved]) return saved;
  } catch(e){}
  return "en";
}

   PRELOADER — the chain assembles on the shared canvas;
   this layer only narrates with numbers.
   ============================================================ */
const S = window.CORE_STATE;

function heroEntrance(){
  if (heroEntrance.done) return;
  heroEntrance.done = true;
  document.body.classList.add("is-ready");
  if (!window.gsap || S.reduced){
    document.querySelectorAll(".nav, .gem-label, .world-hint, .micro-footer span")
      .forEach(el => { el.style.opacity = 1; el.style.transform = "none"; });
    return;
  }
  gsap.timeline()
    .fromTo("#nav", { y: -14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .8, ease: "power3.out" }, .15)
    .fromTo(".gem-label", { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 1.0, ease: "power3.out" }, .55)
    .fromTo(".world-hint", { autoAlpha: 0 }, { autoAlpha: 1, duration: .8 }, .9)
    .fromTo(".micro-footer span", { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .7, stagger: .1 }, .95);
}

(function preloader(){
  const pre = document.getElementById("pre");
  const num = document.getElementById("preNum");

  if (S.reduced || !window.gsap){
    S.progress = 1;
    S.flipAt = performance.now();
    if (pre) pre.remove();
    heroEntrance();
    return;
  }

  const state = { p: 0 };
  const tl = gsap.timeline()
    .to(".pre-count", { opacity: .92, duration: .6, ease: "power2.out" }, .35)
    .to(state, {
      p: 100, duration: 3.2, ease: "power2.inOut",
      onUpdate(){
        /* never regress — the safety timeout below may have finished first */
        S.progress = Math.max(S.progress, state.p / 100);
        num.textContent = Math.round(S.progress * 100);
      }
    }, .3)
    .add(() => { S.flipAt = performance.now(); })            /* circle tilts, core ignites */
    .to(".pre-count", { opacity: 0, duration: .5, ease: "power2.in" }, "+=.05")
    .add(() => { pre.classList.add("done"); heroEntrance(); }, "-=.15");

  /* never trap the visitor — and kill the timeline so it can't rewind
     the assembly it is superseding */
  setTimeout(() => {
    if (!heroEntrance.done){
      tl.kill();
      S.progress = 1;
      if (!S.flipAt) S.flipAt = performance.now();
      pre.classList.add("done");
      heroEntrance();
    }
  }, 8000);
})();

/* ============================================================
   SCROLL → THE WORLD (WebGPU browsers only)
   ============================================================ */
(function(){
  const hasGPU = !!navigator.gpu;
  const hint = document.getElementById("world-hint");
  const dive = document.getElementById("dive");
  const fill = document.getElementById("dive-fill");
  const flash = document.getElementById("dive-flash");
  if (!hasGPU) return;          /* the door stays invisible */
  hint.hidden = false;

  let target = 0;               /* accumulated intent */
  let leaving = false;

  function launch(){
    if (leaving) return;
    leaving = true;
    S.dive = 1;
    if (window.gsap){
      gsap.to(flash, { opacity: 1, duration: .5, ease: "power2.in",
        onComplete: () => { window.location.href = "game/"; } });
    } else {
      window.location.href = "game/";
    }
  }

  const gemLabel = document.querySelector(".gem-label");
  const hintEl = document.getElementById("world-hint");
  function render(){
    if (leaving) return;
    /* ease toward target, decay target slowly so it takes intent, not one flick */
    target = Math.max(0, target - 0.0035);
    S.dive += (target - S.dive) * 0.12;
    if (S.dive < 0.001) S.dive = 0;
    dive.style.opacity = Math.min(1, S.dive * 1.6);
    fill.style.transform = `scaleX(${Math.min(1, S.dive)})`;
    /* the caption steps aside as you fall toward the core */
    if (document.body.classList.contains("is-ready") && S.dive > 0.01){
      const fade = Math.max(0, 1 - S.dive * 1.8);
      gemLabel.style.opacity = fade;
      hintEl.style.opacity = fade;
    }
    if (S.dive > 0.985) launch();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  addEventListener("wheel", (e) => {
    if (document.documentElement.classList.contains("modal-open")) return;
    if (e.deltaY > 0) target = Math.min(1.05, target + e.deltaY * 0.0011);
  }, { passive: true });

  let touchY = null;
  addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (document.documentElement.classList.contains("modal-open") || touchY == null) return;
    const dy = touchY - e.touches[0].clientY;
    touchY = e.touches[0].clientY;
    if (dy > 0) target = Math.min(1.05, target + dy * 0.004);
  }, { passive: true });

  addEventListener("keydown", (e) => {
    if (document.documentElement.classList.contains("modal-open")) return;
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") target = Math.min(1.05, target + 0.16);
  });

  hint.addEventListener("click", () => { target = 1.05; });
})();

/* ============================================================
   MAGNETIC BUTTONS
   ============================================================ */
(function(){
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches || S.reduced) return;
  document.querySelectorAll(".btn").forEach(btn => {
    btn.addEventListener("pointermove", (e) => {
      const r = btn.getBoundingClientRect();
      btn.style.setProperty("--bx", (e.clientX - r.left) + "px");
      btn.style.setProperty("--by", (e.clientY - r.top) + "px");
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      btn.style.transform = `translate(${dx * .1}px, ${dy * .2}px)`;
    });
    btn.addEventListener("pointerleave", () => { btn.style.transform = ""; });
  });
})();

/* ============================================================
   CURSOR + SPOTLIGHT
   ============================================================ */
(function(){
  const html = document.documentElement;
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (!fine || S.reduced) return;

  html.classList.add("cursor-on", "has-cursor");

  let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  function setRaw(px, py){
    html.style.setProperty("--mxp", px + "px");
    html.style.setProperty("--myp", py + "px");
  }
  setRaw(cx, cy);

  document.addEventListener("mousemove", (e) => {
    cx = e.clientX; cy = e.clientY; setRaw(cx, cy);
  }, { passive: true });

  document.addEventListener("mousedown", () => html.classList.add("cursor-press"));
  document.addEventListener("mouseup",   () => html.classList.remove("cursor-press"));
  window.addEventListener("blur",        () => html.classList.remove("cursor-press"));

  const HOVER_SEL = 'a, button, [role="button"], input, select, textarea, label, .world-hint';
  document.addEventListener("mouseover", (e) => {
    if (e.target.closest(HOVER_SEL)) html.classList.add("cursor-hover");
  });
  document.addEventListener("mouseout", (e) => {
    const left = e.target.closest(HOVER_SEL);
    const enter = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(HOVER_SEL);
    if (left && !enter) html.classList.remove("cursor-hover");
  });
  document.addEventListener("mouseleave", () => html.classList.remove("has-cursor"));
  document.addEventListener("mouseenter", () => html.classList.add("has-cursor"));
})();

/* ============================================================
   BOOT

document.addEventListener("DOMContentLoaded", () => {

  gem.addEventListener("pointerleave", () => { S.hover = 0; });
});
</script>

<script type="importmap">
{ "imports": { "three": "./assets/vendor/three.module.min.js" } }

<script type="module">
/* ============================================================
   THE CIRCLE — one scene for the whole page.
     phase 1 (preload): partner-circles drift in chaos, then lock
       one by one into a face-on chain as the counter climbs; the
       chain line draws itself link by link.
     phase 2 (flip):   the closed circle tilts into perspective,
       the crystal core ignites at its centre.
     phase 3 (idle):   living hero — breathing core, orbiting
       chain, a runner spark, cursor parallax.
     phase 4 (dive):   scroll intent pulls the camera through the
       core — into the world.
   Fails silently (atmosphere remains) on any error.
   ============================================================ */
try {
  const S = window.CORE_STATE;
  const THREE = await import("three");
  const { RoomEnvironment } = await import("./assets/vendor/RoomEnvironment.js");

  const canvas = document.getElementById("gl");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 60);
  /* portrait screens need a longer lens so the core never swallows the title */
  const baseZ = () => {
    const a = innerWidth / innerHeight;
    return a < .7 ? 14.5 : a < .95 ? 12 : 9;
  };
  let BZ = baseZ();
  camera.position.set(0, 0, BZ);

  /* Environment: the same HDR the world with the astronaut uses; falls
     back to a synthetic room if it can't be fetched. */
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  (async () => {
    try {
      const { HDRLoader } = await import("./assets/vendor/HDRLoader.js");
      const hdr = await new HDRLoader().loadAsync("game/textures/potsdamer_platz_1k_nb.hdr");
      scene.environment = pmrem.fromEquirectangular(hdr).texture;
      hdr.dispose();
      if (S.reduced) renderer.render(scene, camera); /* static frame refresh */
    } catch(e){ /* RoomEnvironment stays */ }
  })();

  const FOREST = new THREE.Color('#3e7a58');
  const CREAM  = new THREE.Color('#f2ead9');
  const GOLD   = new THREE.Color('#d9b36a');

  const root = new THREE.Group();
  scene.add(root);

  /* ---- the chain: ring group starts face-on to the camera ---- */
  const FACE_ON = Math.PI / 2;
  const TILT_X  = THREE.MathUtils.degToRad(64);
  const TILT_Y  = THREE.MathUtils.degToRad(-8);
  const ring = new THREE.Group();
  ring.rotation.x = FACE_ON;
  root.add(ring);

  const RING_R = 2.9, NODES = 96;
  /* glass beads — same material family as the core */
  const nodes = new THREE.InstancedMesh(
    new THREE.SphereGeometry(.052, 16, 16),
    new THREE.MeshPhysicalMaterial({
      color: 0xffffff, metalness: 0, roughness: .04,
      transmission: 1, thickness: .35, ior: 1.45,
      attenuationColor: FOREST, attenuationDistance: 1.4,
      clearcoat: 1, clearcoatRoughness: .06,
      iridescence: .25, iridescenceIOR: 1.3,
      envMapIntensity: 1.3,
    }), NODES);
  ring.add(nodes);
  const dummy = new THREE.Object3D();

  /* per-node chaos base + motion phases */
  const chaos = [];
  const phases = new Float32Array(NODES);
  for (let i = 0; i < NODES; i++){
    phases[i] = Math.random() * Math.PI * 2;
    const r = 2.2 + Math.random() * 4.6;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    chaos.push(new THREE.Vector3(
      r * Math.sin(ph) * Math.cos(th),
      r * Math.cos(ph) * .8,
      r * Math.sin(ph) * Math.sin(th) * .6
    ));
  }
  const ringPos = [];
  for (let i = 0; i < NODES; i++){
    const a = (i / NODES) * Math.PI * 2;
    ringPos.push(new THREE.Vector3(Math.cos(a) * RING_R, 0, Math.sin(a) * RING_R));
  }

  /* chain line — draws itself link by link via drawRange */
  const SEGS = 256;
  const circlePts = [];
  for (let i = 0; i <= SEGS; i++){
    const a = (i / SEGS) * Math.PI * 2;
    circlePts.push(new THREE.Vector3(Math.cos(a) * RING_R, 0, Math.sin(a) * RING_R));
  }
  const circleGeo = new THREE.BufferGeometry().setFromPoints(circlePts);
  const circle = new THREE.Line(circleGeo,
    new THREE.LineBasicMaterial({ color: FOREST, transparent: true, opacity: .55, blending: THREE.AdditiveBlending }));
  circle.geometry.setDrawRange(0, 0);
  ring.add(circle);

  /* runner spark — a short bright arc chasing around the closed chain */
  const ARC = 22;
  const runnerGeo = new THREE.BufferGeometry().setFromPoints(
    Array.from({ length: ARC }, (_, i) => {
      const a = (i / (ARC - 1)) * 0.5;
      return new THREE.Vector3(Math.cos(a) * RING_R, 0, Math.sin(a) * RING_R);
    }));
  const runner = new THREE.Line(runnerGeo,
    new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
  ring.add(runner);

  /* --- impulses: partners talking through the core.
     A spark leaves a bead, strikes the emerald, and carries on to
     another bead; both beads glow briefly at send and receive. --- */
  const MAX_PULSES = 3;
  const highlight = new Float32Array(NODES);
  let heartFlash = 0;
  const pulseGroup = new THREE.Group();
  root.add(pulseGroup);

  /* ---- the core (hidden until the chain closes) ---- */
  const core = new THREE.Group();
  core.scale.setScalar(.0001);
  root.add(core);
  const gemGeo = new THREE.IcosahedronGeometry(.85, 0);
  const gem = new THREE.Mesh(gemGeo, new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: .06,
    transmission: 1, thickness: 2.2, ior: 1.45,
    attenuationColor: FOREST, attenuationDistance: 2.6,
    iridescence: .35, iridescenceIOR: 1.3,
    clearcoat: 1, clearcoatRoughness: .08, flatShading: true,
  }));
  core.add(gem);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(gemGeo),
    new THREE.LineBasicMaterial({ color: CREAM, transparent: true, opacity: .16 }));
  core.add(edges);
  const heart = new THREE.Mesh(new THREE.IcosahedronGeometry(.3, 1),
    new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: .9 }));
  core.add(heart);
  const heartGlow = new THREE.Mesh(new THREE.IcosahedronGeometry(.46, 1),
    new THREE.MeshBasicMaterial({ color: FOREST, transparent: true, opacity: .26, blending: THREE.AdditiveBlending }));
  core.add(heartGlow);

  /* soft bloom-like halo behind the core (canvas radial sprite) */
  const haloCanvas = document.createElement("canvas");
  haloCanvas.width = haloCanvas.height = 256;
  const hctx = haloCanvas.getContext("2d");
  const grad = hctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, "rgba(190, 240, 210, .85)");
  grad.addColorStop(.35, "rgba(110, 190, 145, .32)");
  grad.addColorStop(1, "rgba(60, 120, 90, 0)");
  hctx.fillStyle = grad;
  hctx.fillRect(0, 0, 256, 256);
  const haloTex = new THREE.CanvasTexture(haloCanvas);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: haloTex, transparent: true, opacity: .5,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  halo.scale.setScalar(3.4);
  core.add(halo);

  /* Each impulse: a small golden head + a fading additive trail, gliding
     along a gently lifted arc — node → core → node. */
  const TRAIL_N = 26;
  const pulses = [];
  for (let i = 0; i < MAX_PULSES; i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: haloTex, color: GOLD, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.setScalar(.24);
    pulseGroup.add(s);

    const tGeo = new THREE.BufferGeometry();
    const tPos = new Float32Array(TRAIL_N * 3);
    const tCol = new Float32Array(TRAIL_N * 3);
    for (let k = 0; k < TRAIL_N; k++){
      const f = Math.pow(1 - k / (TRAIL_N - 1), 2); /* bright head → dark tail */
      tCol[k*3]   = GOLD.r * f;
      tCol[k*3+1] = GOLD.g * f;
      tCol[k*3+2] = GOLD.b * f;
    }
    tGeo.setAttribute("position", new THREE.BufferAttribute(tPos, 3));
    tGeo.setAttribute("color", new THREE.BufferAttribute(tCol, 3));
    const trail = new THREE.Line(tGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    pulseGroup.add(trail);

    pulses.push({ sprite: s, trail, tPos, active: false, leg: 0, a: 0, b: 0, t: 0, wait: 1.6 + i * 1.8 });
  }
  const pTmpA = new THREE.Vector3(), pTmpB = new THREE.Vector3(), pCenter = new THREE.Vector3();
  const pMid = new THREE.Vector3(), pHead = new THREE.Vector3();
  const nodePosInRoot = (i, out) => out.copy(ringPos[i]).applyMatrix4(ring.matrix);
  /* quadratic bezier with a lifted midpoint — a calm arc, not a laser */
  function arcPoint(from, to, e, out){
    pMid.lerpVectors(from, to, .5);
    pMid.y += .6;
    const u = 1 - e;
    out.set(
      u*u*from.x + 2*u*e*pMid.x + e*e*to.x,
      u*u*from.y + 2*u*e*pMid.y + e*e*to.y,
      u*u*from.z + 2*u*e*pMid.z + e*e*to.z
    );
    return out;
  }
  function seedTrail(p, v){
    for (let k = 0; k < TRAIL_N; k++){
      p.tPos[k*3] = v.x; p.tPos[k*3+1] = v.y; p.tPos[k*3+2] = v.z;
    }
    p.trail.geometry.attributes.position.needsUpdate = true;
  }
  function pushTrail(p, v){
    const a = p.tPos;
    for (let k = TRAIL_N - 1; k > 0; k--){
      a[k*3] = a[(k-1)*3]; a[k*3+1] = a[(k-1)*3+1]; a[k*3+2] = a[(k-1)*3+2];
    }
    a[0] = v.x; a[1] = v.y; a[2] = v.z;
    p.trail.geometry.attributes.position.needsUpdate = true;
  }

  /* ---- dust ---- */
  const DUST = 340;
  const dustPos = new Float32Array(DUST * 3);
  for (let i = 0; i < DUST; i++){
    const r = 3.4 + Math.random() * 5.5;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    dustPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    dustPos[i*3+1] = (Math.random() - .5) * 6.5;
    dustPos[i*3+2] = r * Math.sin(ph) * Math.sin(th) - 1.5;
  }
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    color: CREAM, size: .02, transparent: true, opacity: .4,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(dust);

  /* ---- light ---- */
  scene.add(new THREE.AmbientLight(new THREE.Color('#12281c'), 2.2));
  const key = new THREE.DirectionalLight(CREAM, 1.6);
  key.position.set(4, 6, 6);
  scene.add(key);
  const rimG = new THREE.PointLight(FOREST, 24, 22);
  rimG.position.set(-6, -2, 3);
  scene.add(rimG);
  const rimGold = new THREE.PointLight(GOLD, 12, 20);
  rimGold.position.set(5, -4, -3);
  scene.add(rimGold);

  /* ---- interaction ---- */
  const mouse = new THREE.Vector2(0, 0);
  addEventListener("pointermove", (e) => {
    mouse.x = (e.clientX / innerWidth)  * 2 - 1;
    mouse.y = (e.clientY / innerHeight) * 2 - 1;
  }, { passive: true });

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    BZ = baseZ();
  });

  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  const clock = new THREE.Clock();
  const tmp = new THREE.Vector3();
  let raf = null;

  let lastT = 0;
  function frame(){
    const t = clock.getElapsedTime();
    const dt = Math.min(.05, Math.max(.001, t - lastT));
    lastT = t;
    const p = S.progress;

    /* flip factor 0→1 after the chain closes */
    let flip = 0;
    if (S.flipAt){
      flip = Math.min(1, (performance.now() - S.flipAt) / 1100);
      flip = easeInOut(flip);
    }

    /* --- nodes: chaos → chain, one by one --- */
    let assembled = 0;
    for (let i = 0; i < NODES; i++){
      /* staggered lock-in: node i assembles in its own progress window */
      const local = Math.min(1, Math.max(0, (p * 1.45 - (i / NODES) * .85) / .6));
      const e = easeOut(local);
      if (local >= 1) assembled++;

      const cb = chaos[i];
      /* chaotic drift: slow orbit + bob around the base position */
      tmp.set(
        cb.x + Math.sin(t * .5 + phases[i]) * .5,
        cb.y + Math.cos(t * .38 + phases[i] * 1.3) * .5,
        cb.z + Math.sin(t * .44 + phases[i] * .7) * .4
      );
      tmp.lerp(ringPos[i], e);
      /* settled nodes keep a tiny communal pulse */
      const pulse = 1 + Math.sin(t * 1.1 + phases[i]) * .3 * e;
      /* lock-in pop: brief overshoot right as a node clicks into the chain */
      const pop = local > 0 && local < 1 ? 1 + Math.sin(local * Math.PI) * .9 : 1;
      /* message glow: sender/receiver beads swell for a moment */
      highlight[i] *= Math.exp(-dt * 2.1);

      dummy.position.copy(tmp);
      dummy.scale.setScalar((.8 + .5 * e) * pulse * pop * (1 + highlight[i] * .65));
      dummy.updateMatrix();
      nodes.setMatrixAt(i, dummy.matrix);
    }
    nodes.instanceMatrix.needsUpdate = true;

    /* chain line draws behind the locked nodes */
    circle.geometry.setDrawRange(0, Math.floor((assembled / NODES) * (SEGS + 1)));

    /* --- flip: face-on chain tilts into the hero pose, core ignites --- */
    ring.rotation.x = FACE_ON + (TILT_X - FACE_ON) * flip;
    ring.rotation.y = TILT_Y * flip;
    const coreScale = flip < .01 ? .0001 : (flip < .6 ? easeOut(flip / .6) * 1.18 : 1.18 - .18 * easeInOut((flip - .6) / .4));

    /* --- idle life (scaled by flip so it wakes with the core) --- */
    /* hover eases in/out — the emerald notices the cursor */
    S._h = (S._h ?? 0) + ((S.hover || 0) - (S._h ?? 0)) * .07;
    const hov = S._h;

    gem.rotation.y = t * (.12 + hov * .3);
    gem.rotation.x = Math.sin(t * .2) * .2;
    edges.rotation.copy(gem.rotation);
    core.position.y = Math.sin(t * .5) * .09 * flip;
    const coreBoost = 1 + hov * .07;
    core.scale.setScalar(coreScale * coreBoost);
    const hb = 1 + Math.sin(t * (1.4 + hov * 1.4)) * .12 + heartFlash * .2;
    heart.scale.setScalar(hb);
    heartGlow.scale.setScalar(hb * 1.15);
    halo.material.opacity = .5 + hov * .3 + heartFlash * .35 + Math.sin(t * 1.5) * .07;
    halo.scale.setScalar(3.4 + Math.sin(t * .8) * .15 + hov * .5 + heartFlash * .4);

    ring.rotation.z = t * (.032 + S.dive * .9);
    dust.rotation.y = t * .009;

    /* runner spark appears once the chain is closed; hurries when hovered */
    runner.material.opacity = flip * (.7 + Math.sin(t * 1.8) * .25);
    runner.rotation.y = -t * (.5 + hov * .9);

    /* --- impulses between partners (only once the chain is closed) --- */
    if (flip > .99){
      pCenter.set(0, core.position.y, 0);
      for (const pu of pulses){
        if (!pu.active){
          pu.wait -= dt;
          if (pu.wait <= 0){
            pu.active = true; pu.leg = 0; pu.t = 0;
            pu.a = Math.floor(Math.random() * NODES);
            pu.b = (pu.a + 12 + Math.floor(Math.random() * (NODES - 24))) % NODES;
            highlight[pu.a] = 1;                    /* sender lights up */
            nodePosInRoot(pu.a, pTmpA);
            seedTrail(pu, pTmpA);
            pu.trail.material.opacity = .8;
          }
          continue;
        }
        pu.t += dt / 2.4;                           /* unhurried — one leg ≈ 2.4s */
        const e = easeInOut(Math.min(1, pu.t));
        if (pu.leg === 0){
          nodePosInRoot(pu.a, pTmpA);
          arcPoint(pTmpA, pCenter, e, pHead);
        } else {
          nodePosInRoot(pu.b, pTmpB);
          arcPoint(pCenter, pTmpB, e, pHead);
        }
        pu.sprite.position.copy(pHead);
        pushTrail(pu, pHead);
        pu.sprite.material.opacity = .9 - Math.abs(e - .5) * .25;
        if (pu.t >= 1){
          if (pu.leg === 0){
            pu.leg = 1; pu.t = 0;
            heartFlash = 1;                         /* the impulse strikes the emerald */
          } else {
            highlight[pu.b] = 1;                    /* receiver lights up */
            pu.active = false;
            pu.sprite.material.opacity = 0;
            pu.trail.material.opacity = 0;
            pu.wait = 1.4 + Math.random() * 2.6;
          }
        }
      }
      heartFlash *= Math.exp(-dt * 3.8);
    }

    /* --- dive: the camera falls through the core --- */
    const d = S.dive;
    camera.position.z = BZ - d * (BZ - 2.6);
    renderer.toneMappingExposure = 1.0 + d * .9;
    heart.material.opacity = .9 + d * .1;
    heartGlow.material.opacity = .26 + d * .5 + heartFlash * .5;

    /* cursor parallax — unhurried, follows with a soft lag */
    root.rotation.y += ((mouse.x * .26) - root.rotation.y) * .035;
    root.rotation.x += ((mouse.y * .18) - root.rotation.x) * .035;
    camera.position.x += ((mouse.x * .36) - camera.position.x) * .028;
    camera.position.y += ((-mouse.y * .26) - camera.position.y) * .028;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
    raf = requestAnimationFrame(frame);
  }

  if (S.reduced){
    /* static, assembled, facing the hero pose */
    S.progress = 1;
    ring.rotation.x = TILT_X; ring.rotation.y = TILT_Y;
    core.scale.setScalar(1);
    circle.geometry.setDrawRange(0, SEGS + 1);
    for (let i = 0; i < NODES; i++){
      dummy.position.copy(ringPos[i]);
      dummy.scale.setScalar(1.2);
      dummy.updateMatrix();
      nodes.setMatrixAt(i, dummy.matrix);
    }
    nodes.instanceMatrix.needsUpdate = true;
    renderer.render(scene, camera);
  } else {
    frame();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden){ if (raf){ cancelAnimationFrame(raf); raf = null; } }
      else if (!raf) frame();
    });
  }
} catch (err) {
  console.warn("circle scene disabled:", err);
  document.getElementById("gl")?.remove();
}
</script>

</body>
</html>
